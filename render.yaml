services:
  - type: web
    name: neurolens-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neurolens-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://neurolens.vercel.app"]'
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: neurolens-db
    plan: basic
