services:
  - type: web
    name: neurolens-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      # Set DATABASE_URL in the Render dashboard (e.g. Supabase Postgres pooler).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set GEMINI_API_KEY in the Render dashboard (Google AI Studio key).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: CORS_ORIGINS
        value: '["http://localhost:5173", "http://localhost:5175", "https://frontend-omega-neon-66.vercel.app"]'
